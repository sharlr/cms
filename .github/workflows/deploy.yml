name: Deploy CMS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cms-nexusrajan
  cancel-in-progress: true

env:
  APP_DIR: /var/www/cms.nexusrajan.com

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack release
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./.env' \
            --exclude='./coverage' \
            --exclude='./docs/preview' \
            --exclude='./.claude' \
            --exclude='./cms-release.tar.gz' \
            -czf cms-release.tar.gz .

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          source: cms-release.tar.gz
          target: /tmp
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          envs: SERVER_ENV
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ env.APP_DIR }}"
            sudo mkdir -p "$APP_DIR" /var/www/certbot
            sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"

            tar -xzf /tmp/cms-release.tar.gz -C "$APP_DIR"
            rm -f /tmp/cms-release.tar.gz

            cd "$APP_DIR"
            printf '%s\n' "$SERVER_ENV" > .env
            chmod 600 .env

            if [ -f deploy/nginx/cms.nexusrajan.com.conf ]; then
              sudo cp deploy/nginx/cms.nexusrajan.com.conf /etc/nginx/sites-available/cms.nexusrajan.com.conf
              sudo ln -sfn /etc/nginx/sites-available/cms.nexusrajan.com.conf /etc/nginx/sites-enabled/cms.nexusrajan.com.conf

              if command -v nginx >/dev/null 2>&1; then
                if sudo nginx -t; then
                  sudo systemctl reload nginx
                else
                  echo "nginx -t failed (often missing TLS certs). Run: sudo certbot --nginx -d cms.nexusrajan.com"
                fi
              fi
            fi

            docker compose pull || true
            docker compose up -d --build --remove-orphans
            docker compose ps

            echo "Deployed → https://cms.nexusrajan.com/ (upstream 127.0.0.1:8888)"
