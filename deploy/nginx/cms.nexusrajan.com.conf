# Nginx site for https://cms.nexusrajan.com/
# Upstream: Next.js on 127.0.0.1:8888 (Docker HOST_PORT)
#
# Install:
#   sudo cp deploy/nginx/cms.nexusrajan.com.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/cms.nexusrajan.com.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d cms.nexusrajan.com   # first-time TLS
#   sudo nginx -t && sudo systemctl reload nginx

upstream cms_nexusrajan {
    server 127.0.0.1:8888;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.nexusrajan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.nexusrajan.com;

    ssl_certificate     /etc/letsencrypt/live/cms.nexusrajan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.nexusrajan.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://cms_nexusrajan;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering off;
    }
}
